name: Project checks
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'evidence/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_mail.py
      - name: Test portable timer
        run: |
          mkdir -p hardware/build
          cc -std=c99 -Wall -Wextra -Werror hardware/src/focus_timer.c hardware/tests/test_focus_timer.c -Ihardware/include -o hardware/build/test_focus_timer
          hardware/build/test_focus_timer
